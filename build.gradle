plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// No org.openjfx dependencies are declared: this project is built and run with the
// "25.0.3.fx-zulu" JDK distribution (see AGENTS.md), which bundles the JavaFX modules
// directly in the JDK, so they're available without adding them as Gradle dependencies.

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // Launcher (not Main) is the entry point: Main extends javafx.application.Application,
    // and launching that class directly can trip up JavaFX's classpath scanning, especially
    // from a shaded jar. Launcher just calls Application.launch(Main.class, ...) instead.
    mainClass = 'waddles.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'waddles.jar'
}

run {
    standardInput = System.in
}
